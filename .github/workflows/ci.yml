name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.24"
          working-directory: backend
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run pytest
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Surfaces existing ESLint debt without failing the required check.
      # Cleanup of the generated client and Chat/Document pages is a separate chore.
      - name: Lint (non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --pretty false
