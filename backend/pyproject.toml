[project]
name = "apply-assistant-backend"
version = "0.1.0"
description = "Agentic RAG knowledge-base backend for study-abroad application Q&A"
readme = "README.md"
authors = [
    { name = "junqiangyuan" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.6.3",
    "cos-python-sdk-v5>=1.9.44",
    "docling>=2.121.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-community<0.4.2",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.8.3",
    "mcp>=2.2.0",
    "pgvector>=0.5.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "redis>=6.4.0",
    "redisvl>=0.27.1",
    "socksio>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"

[dependency-groups]
dev = [
    "ipython>=9.17.0",
    "pytest>=9.1.1",
]
